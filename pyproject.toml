[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foodbankflow"
version = "0.1.0"
description = "AgentCore runtime for foodbank-flow"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0",
    "strands-agents-tools>=0.2",
    "bedrock-agentcore>=0.1",
    "boto3>=1.35",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
